{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: userdata-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:

  - host: {{ .Values.ingress.host }}

    http:

      paths:

      - path: /submit
        pathType: Prefix
        backend:
          service:
            name: submit-service
            port:
              number: 80

      - path: /fetch
        pathType: Prefix
        backend:
          service:
            name: fetch-service
            port:
              number: 80

      - path: /
        pathType: Prefix
        backend:
          service:
            name: home-service
            port:
              number: 80

{{- end }}
